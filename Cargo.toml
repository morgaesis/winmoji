[package]
name = "winmoji"
version = "0.1.0"
edition = "2024"
description = "A fast keyboard-first Unicode picker for Windows"
license = "MIT"
repository = "https://github.com/morgaesis/winmoji"

[features]
console = []

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

[dependencies]
emojis = "0.9.0"
unicode-general-category = "1.1.0"
unicode_names2 = "3.1.0"

[build-dependencies]
embed-resource = "3.0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Foundation_Numerics", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "0.2.0"
